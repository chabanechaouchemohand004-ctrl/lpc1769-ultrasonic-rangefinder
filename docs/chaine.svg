<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
  <rect width="900" height="300" rx="10" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- Row titles -->
  <text x="200" y="98" font-weight="700" fill="#7a3b06" font-size="13">ÉMISSION</text>
  <text x="600" y="212" font-weight="700" fill="#1d3557" font-size="13">RÉCEPTION</text>

  <!-- MCU (spans both rows) -->
  <rect x="20" y="20" width="130" height="260" rx="8" fill="#f6f6f6" stroke="#555"/>
  <text x="85" y="72" text-anchor="middle" font-weight="700" fill="#222">LPC1769</text>
  <text x="85" y="90" text-anchor="middle" fill="#444">Cortex-M3</text>
  <text x="85" y="108" text-anchor="middle" fill="#444">100 MHz</text>
  <text x="85" y="140" text-anchor="middle" fill="#7a3b06">P2.13 GPIO</text>
  <text x="85" y="156" text-anchor="middle" fill="#7a3b06">(TIMER1 MR0)</text>
  <text x="85" y="238" text-anchor="middle" fill="#1d3557">P1.18 CAP1.0</text>
  <text x="85" y="254" text-anchor="middle" fill="#1d3557">(TIMER1 capture)</text>

  <!-- Emission row -->
  <g>
    <rect x="200" y="110" width="140" height="56" rx="6" fill="#fdf1e7" stroke="#c46a1b"/>
    <text x="270" y="133" text-anchor="middle" font-weight="600" fill="#7a3b06">Driver de grille</text>
    <text x="270" y="151" text-anchor="middle" fill="#333">IR2304 (3,3 V → 12 V)</text>

    <rect x="380" y="110" width="140" height="56" rx="6" fill="#fdf1e7" stroke="#c46a1b"/>
    <text x="450" y="133" text-anchor="middle" font-weight="600" fill="#7a3b06">MOSFET</text>
    <text x="450" y="151" text-anchor="middle" fill="#333">IRFZ24N, 12 V</text>

    <rect x="560" y="110" width="150" height="56" rx="6" fill="#fdf1e7" stroke="#c46a1b"/>
    <text x="635" y="133" text-anchor="middle" font-weight="600" fill="#7a3b06">Transducteur TX</text>
    <text x="635" y="151" text-anchor="middle" fill="#333">400ST100 · 40 kHz</text>

    <line x1="150" y1="138" x2="198" y2="138" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="340" y1="138" x2="378" y2="138" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="520" y1="138" x2="558" y2="138" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="175" y="130" text-anchor="middle" font-size="10" fill="#555">8×40 kHz</text>
  </g>

  <!-- Obstacle -->
  <rect x="780" y="110" width="100" height="165" rx="6" fill="#eeeeee" stroke="#888" stroke-dasharray="4 3"/>
  <text x="830" y="185" text-anchor="middle" font-weight="600" fill="#333">Obstacle</text>
  <text x="830" y="203" text-anchor="middle" fill="#555">5 – 250 cm</text>
  <path d="M712,130 Q745,120 778,130" fill="none" stroke="#c46a1b" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M778,250 Q745,260 712,250" fill="none" stroke="#3b6fb6" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Reception row (right to left) -->
  <g>
    <rect x="600" y="222" width="110" height="56" rx="6" fill="#eef3fb" stroke="#3b6fb6"/>
    <text x="655" y="245" text-anchor="middle" font-weight="600" fill="#1d3557">Transducteur RX</text>
    <text x="655" y="263" text-anchor="middle" fill="#333">400SR100</text>

    <rect x="480" y="222" width="100" height="56" rx="6" fill="#eef3fb" stroke="#3b6fb6"/>
    <text x="530" y="245" text-anchor="middle" font-weight="600" fill="#1d3557">Filtre RLC</text>
    <text x="530" y="263" text-anchor="middle" fill="#333">f0 ≈ 39,8 kHz</text>

    <rect x="360" y="222" width="100" height="56" rx="6" fill="#eef3fb" stroke="#3b6fb6"/>
    <text x="410" y="245" text-anchor="middle" font-weight="600" fill="#1d3557">Ampli ×300</text>
    <text x="410" y="263" text-anchor="middle" fill="#333">×10 puis ×30</text>

    <rect x="250" y="222" width="95" height="56" rx="6" fill="#eef3fb" stroke="#3b6fb6"/>
    <text x="297" y="245" text-anchor="middle" font-weight="600" fill="#1d3557">Détecteur</text>
    <text x="297" y="263" text-anchor="middle" fill="#333">de crête</text>

    <rect x="170" y="222" width="68" height="56" rx="6" fill="#eef3fb" stroke="#3b6fb6"/>
    <text x="204" y="245" text-anchor="middle" font-weight="600" fill="#1d3557">LM311</text>
    <text x="204" y="263" text-anchor="middle" fill="#333">seuil</text>

    <line x1="600" y1="250" x2="582" y2="250" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="480" y1="250" x2="462" y2="250" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="360" y1="250" x2="347" y2="250" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="250" y1="250" x2="240" y2="250" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="170" y1="250" x2="152" y2="250" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="204" y="214" text-anchor="middle" font-size="11" fill="#555">sortie 0/3,3 V</text>
  </g>
</svg>
